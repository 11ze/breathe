<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>呼吸球对比</title><style>*{box-sizing:border-box}html,body{margin:0;font-family:-apple-system,"PingFang SC",sans-serif;color:#242b28;font-size:13px}button,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #5b9fbc;outline-offset:3px}button{border:1px solid #cbd2cb;background:#fff;border-radius:6px;padding:7px 12px}button[aria-pressed=true]{background:#26734f;color:white;border-color:#26734f}small{color:#66716b}
 body{background:#dce5df}.desktop{height:560px;position:relative;background:radial-gradient(ellipse at 25% 90%,#e9eee5,#dce5df 45%,#c8d5ce)}.bar{height:32px;background:#f2f6f2aa;border-bottom:1px solid #b6c4ba66;display:flex;justify-content:space-between;padding:7px 20px;font-size:12px}.stage{height:385px;display:grid;place-items:center;position:relative}.orb-area{width:240px;height:240px;display:grid;place-items:center;position:relative}.glow{position:absolute;inset:12px;background:radial-gradient(circle,#75b99b45,transparent 68%)}.ball{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 42% 36%,#4bc984,#6cc5ad88 70%);box-shadow:inset 0 0 30px #ffffff30;display:grid;place-items:center;transform:scale(.65)}.digits{font-size:36px;font-weight:650;color:#fff;text-shadow:0 1px 4px #0004}.fixed{position:absolute;pointer-events:none}.phase{position:absolute;top:9px;font-size:16px;font-weight:500;color:#345c43}.hint{position:absolute;bottom:12px;font-size:12px;color:#52685b;margin:0}.controls{margin:0 26px;background:#f5f6f4e8;border:1px solid #fff9;border-radius:10px;padding:14px;display:flex;align-items:center;justify-content:center;gap:8px}.caption{text-align:center;font-size:11px;color:#66716b;margin:12px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
 </style></head><body><div class="desktop"><div class="bar"><b>访达</b><span>≋　09:42</span></div><main class="stage"><div class="orb-area"><div class="glow"></div><div class="ball" id="ball"><span class="digits" id="seconds">3</span></div></div></main><div class="controls"><label class="sr" for="phase">阶段</label><select id="phase"><option value="inhale">吸气</option><option value="exhale">呼气</option><option value="paused">暂停</option></select><button id="play" aria-pressed="false">播放一轮</button><button id="minimum">查看最小尺寸</button></div><p class="caption">演示控制 · 吸气 5 秒 / 呼气 5 秒 · 不播放声音</p></div><script>
 const ball=document.getElementById('ball'),seconds=document.getElementById('seconds'),phase=document.getElementById('phase'),play=document.getElementById('play');let timer=null,progress=.5;
 function stop(){clearInterval(timer);timer=null;play.textContent='播放一轮';play.setAttribute('aria-pressed','false')}
 function render(){let q=phase.value,scale=q==='inhale'?.3+.7*progress:q==='exhale'?1-.7*progress:.5;ball.style.transform=`scale(${scale})`;ball.style.background=q==='exhale'?'radial-gradient(circle at 42% 36%,#ea8c6f,#e8ab7988 70%)':q==='paused'?'radial-gradient(circle at 42% 36%,#dda44f,#e9cb7888 70%)':'radial-gradient(circle at 42% 36%,#4bc984,#6cc5ad88 70%)';seconds.textContent=q==='paused'?'Ⅱ':Math.max(1,Math.ceil(5*(1-progress)));let label=document.getElementById('phase-label');if(label)label.textContent={inhale:'吸气',exhale:'呼气',paused:'已暂停'}[q]}
 phase.onchange=()=>{stop();progress=.5;render()};document.getElementById('minimum').onclick=()=>{stop();phase.value='inhale';progress=0;render()};play.onclick=()=>{if(timer){stop();return}phase.value='inhale';progress=0;let start=performance.now();play.textContent='停止播放';play.setAttribute('aria-pressed','true');timer=setInterval(()=>{let elapsed=(performance.now()-start)/1000;if(elapsed>=10){stop();phase.value='exhale';progress=1;render();return}phase.value=elapsed<5?'inhale':'exhale';progress=(elapsed%5)/5;render()},50);render()};render();
 </script></body></html>
