<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>菜单栏倒计时颜色对比</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#f3f4f3;color:#242b28;font:13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{padding:24px}h1{font-size:16px;margin:0 0 20px}p{font-size:12px;color:#66716b;margin:0 0 7px}.bar{height:36px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:#292d2a;color:#ffffff;border-radius:5px}.right{display:flex;align-items:center;gap:14px}.mark{font-size:25px;line-height:1}strong{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}.sample+.sample{margin-top:20px}.note{margin-top:18px;line-height:1.6}
</style></head><body><main><h1>深色菜单栏</h1><section class="sample"><p>当前：绿色倒计时</p><div class="bar"><span>访达　 文件　 编辑　 显示</span><span class="right"><span class="mark">≋</span><strong style="color:#26734f">19:42</strong><span>14:00</span></span></div></section><section class="sample"><p>候选：白色倒计时</p><div class="bar"><span>访达　 文件　 编辑　 显示</span><span class="right"><span class="mark">≋</span><strong style="color:#ffffff">19:42</strong><span>14:00</span></span></div></section><p class="note">深色背景下，白字比当前绿色更清楚。</p></main></body></html>
